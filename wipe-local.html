<!doctype html><meta charset="utf-8"><title>Clearing local app data</title><p>Clearing local app data…</p><script>(async()=>{try{localStorage.clear();sessionStorage.clear();if(indexedDB&&indexedDB.databases){for(const db of await indexedDB.databases()){if(db.name)indexedDB.deleteDatabase(db.name)}}if(navigator.serviceWorker){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}document.body.innerHTML="<p>Local app data cleared.</p>"})()</script>
